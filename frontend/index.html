<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灭世SMS - 专业的全球短信管理平台</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --primary-dark: #1d4ed8;
            --bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(226, 232, 240, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态 Aura 背景 */
        .aura {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            filter: blur(100px);
            opacity: 0.4;
        }

        .aura-blob {
            position: absolute;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: var(--primary-light);
            animation: move 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
        }

        .aura-blob-1 { top: -10%; left: -10%; background: #bfdbfe; }
        .aura-blob-2 { bottom: -10%; right: -10%; background: #dbeafe; animation-delay: -5s; }
        .aura-blob-3 { top: 40%; left: 50%; width: 30vw; height: 30vw; background: #eff6ff; animation-delay: -10s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(10%, 10%) scale(1.1); }
        }

        /* 装饰网格 */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        /* 顶部 Logo */
        .header {
            display: flex;
            justify-content: center;
            margin-bottom: 4rem;
            opacity: 0;
            animation: slideDown 0.8s forwards;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .logo-box {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 主体内容 */
        .hero {
            margin-bottom: 4rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1rem;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 99px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 2rem;
            border: 1px solid #dbeafe;
            opacity: 0;
            animation: fadeIn 0.8s forwards 0.2s;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            opacity: 0;
            animation: slideUp 0.8s forwards 0.4s;
        }

        h1 span {
            background: linear-gradient(to bottom right, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: clamp(1.125rem, 3vw, 1.35rem);
            color: var(--text-muted);
            max-width: 640px;
            margin: 0 auto 3.5rem;
            line-height: 1.6;
            opacity: 0;
            animation: slideUp 0.8s forwards 0.6s;
        }

        /* 按钮设计 */
        .cta-group {
            opacity: 0;
            animation: slideUp 0.8s forwards 0.8s;
        }

        .btn-primary {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 1.125rem 2.75rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1.125rem;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        /* 统计卡片 */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-top: 6rem;
            opacity: 0;
            animation: fadeIn 1s forwards 1s;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: left;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-light);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 动画定义 */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 底部 */
        footer {
            margin-top: auto;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            opacity: 0;
            animation: fadeIn 1s forwards 1.2s;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="aura">
        <div class="aura-blob aura-blob-1"></div>
        <div class="aura-blob aura-blob-2"></div>
        <div class="aura-blob aura-blob-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-box">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2L11 13"></path>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </div>
                灭世SMS
            </div>
        </header>

        <main class="hero">
            <div class="badge">
                <span style="margin-right: 8px;">✨</span> 全新 2.0 版本现已上线
            </div>
            
            <h1>连接全球<br>触达<span>每一个可能</span></h1>
            
            <p class="description">
                基于全分布式云端弹性架构，原生支持高并发吞吐、毫秒级触达。
            </p>
            
            <div class="cta-group">
                <a href="/views/user/login.html" class="btn-primary">
                    立即开启之旅
                    <svg style="margin-left: 10px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            </div>
        </main>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value">99.99%</div>
                <div class="stat-label">系统可用性保证</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">200+</div>
                <div class="stat-label">覆盖国家与地区</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">&lt; 3s</div>
                <div class="stat-label">全球平均送达时间</div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 SharkEco | 短信管理平台. 保留所有权利.
    </footer>
</body>
</html>
