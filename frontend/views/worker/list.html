<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>节点管理</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../res/adminui/dist/css/admin.css" media="all">
  <link rel="stylesheet" href="../../res/layui/css/shark.css" media="all">
</head>
<body>

  <div class="layui-fluid" style="padding: 20px;">
    <div class="layui-card panel-card">
      <div class="layui-form layui-card-header layuiadmin-card-header-auto">
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label">节点名称</label>
            <div class="layui-input-block">
              <input type="text" name="agent_name" placeholder="请输入" autocomplete="off" class="layui-input">
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label">节点 IP</label>
            <div class="layui-input-block">
              <input type="text" name="agent_ip" placeholder="请输入" autocomplete="off" class="layui-input">
            </div>
          </div>
          <div class="layui-inline">
            <button class="layui-btn layuiadmin-btn-worker" lay-submit lay-filter="LAY-worker-search">
              <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i> 搜索
            </button>
          </div>
        </div>
      </div>
      
      <div class="layui-card-body">
        <div style="padding-bottom: 10px;">
          <button class="layui-btn layui-btn-normal layuiadmin-btn-worker" data-type="add">添加节点</button>
        </div>
        
        <table id="LAY-worker-manage" lay-filter="LAY-worker-manage"></table>

        <script type="text/html" id="table-worker-admin">
          <a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="deploy"><i class="layui-icon layui-icon-code-circle"></i>部署</a>
          <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="check"><i class="layui-icon layui-icon-refresh"></i>检测</a>
          <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
          <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
        </script>
      </div>
    </div>
  </div>

  <script src="../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../res/' // 静态资源所在路径
  }).use(['index', 'workeradmin', 'table'], function(){
    var $ = layui.$
    ,form = layui.form
    ,table = layui.table
    ,admin = layui.admin;
    
    // 搜索
    form.on('submit(LAY-worker-search)', function(data){
      var field = data.field;
      table.reload('LAY-worker-manage', {
        where: field
      });
    });
  
    // 事件
    var active = {
      add: function(){
        layer.open({
          type: 2
          ,title: '添加节点'
          ,content: 'workerform.html'
          ,maxmin: true
          ,area: ['500px', '300px']
          ,btn: ['确定', '取消']
          ,yes: function(index, layero){
            var iframeWindow = window['layui-layer-iframe'+ index]
            ,submitID = 'LAY-worker-submit'
            ,submit = layero.find('iframe').contents().find('#'+ submitID);

            iframeWindow.layui.form.on('submit('+ submitID +')', function(data){
              var field = data.field;
              
              admin.req({
                url: layui.setter.paths.baseApi + '/api/worker-agents'
                ,method: 'POST'
                ,data: field
                ,done: function(res){
                  table.reload('LAY-worker-manage');
                  layer.close(index);
                  layer.msg('添加成功');
                }
              });
            });  
            
            submit.trigger('click');
          }
        }); 
      }
    };
    
    $('.layui-btn.layuiadmin-btn-worker').on('click', function(){
      var type = $(this).data('type');
      active[type] ? active[type].call(this) : '';
    });
  });
  </script>
</body>
</html>
