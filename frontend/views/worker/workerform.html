<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>节点表单</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../res/layui/css/shark.css" media="all">
  <style>
    .layui-form-label { width: 100px; }
    .layui-input-block { margin-left: 130px; }
    /* 统一使用 13px 字号以保持精致感 */
    .layui-input, .layui-select, .layui-textarea, .layui-form-label {
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="layui-form" lay-filter="LAY-worker-form" id="LAY-worker-form" style="padding: 20px 30px 0 0;">
    <div class="layui-form-item">
      <label class="layui-form-label">节点名称</label>
      <div class="layui-input-block">
        <input type="text" name="agent_name" lay-verify="required" placeholder="请输入节点名称（仅限英文数字）" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">节点 IP</label>
      <div class="layui-input-block">
        <input type="text" name="agent_ip" lay-verify="required" placeholder="请输入节点 IP 地址" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item layui-hide">
      <input type="button" lay-submit lay-filter="LAY-worker-submit" id="LAY-worker-submit" value="确认">
    </div>
  </div>

  <script src="../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../res/' 
  }).use(['index', 'form'], function(){
    var $ = layui.$
    ,form = layui.form;
  })
  </script>
</body>
</html>
