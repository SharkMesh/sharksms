<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>系统配置</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../res/adminui/dist/css/admin.css" media="all">
  <link rel="stylesheet" href="../../res/layui/css/shark.css" media="all">
</head>
<body>
  <div class="layui-fluid" style="padding: 20px;">
    <div class="layui-row layui-col-space15">
      <div class="layui-col-md12">
        <div class="layui-card panel-card">
          <div class="layui-card-header">系统配置</div>
          <div class="layui-card-body" pad15>
            <div class="layui-form" lay-filter="system-config-form">
              <div class="layui-form-item">
                <label class="layui-form-label">注册开关</label>
                <div class="layui-input-inline">
                  <input type="checkbox" name="register_enabled" lay-skin="switch" lay-text="开启|关闭">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">任务价格</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="points_per_minute" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">积分/分钟</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">全局线程数</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="global_max_threads" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">最大同时并发线程(-1为不限制)</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">全局日订单</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="daily_order_limit" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">单日最大订单数(-1为不限制)</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">全局日卡密</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="daily_voucher_limit" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">单日卡密生成数上限(-1为不限制)</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">免费模式默认提交分钟数</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="free_mode_default_minutes" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">免费模式下用户默认提单的分钟数(实际时长 = (用户选择时长 / 系统配置显示时长) * 系统配置默认时长)</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">免费模式展示分钟数</label>
                <div class="layui-input-inline" style="width: 150px;">
                  <input type="number" name="free_mode_display_minutes" lay-verify="required|number" step="1" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">免费模式下前端展示的分钟数(建议填写最大档位的时长)</div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">机器人Token</label>
                <div class="layui-input-block">
                  <input type="text" name="tg_bot_token" placeholder="请输入 Telegram Bot Token" autocomplete="off" class="layui-input">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">管理员ID</label>
                <div class="layui-input-block">
                  <input type="text" name="tg_admin_ids" placeholder="请输入管理员 ID，多个用英文逗号分隔" autocomplete="off" class="layui-input">
                </div>
              </div>
              <div class="layui-form-item">
                <label class="layui-form-label">测试手机号</label>
                <div class="layui-input-block">
                  <input type="text" name="test_phone" placeholder="请输入测试接收手机号" autocomplete="off" class="layui-input">
                </div>
              </div>
              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button class="layui-btn" lay-submit lay-filter="system-config-submit">保存</button>
                  <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../res/'
  }).extend({
    systemadmin: 'modules/systemadmin'
  }).use(['index', 'systemadmin']);
  </script>
</body>
</html>
