<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>下级用户列表</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../../res/adminui/dist/css/admin.css" media="all">
  <link rel="stylesheet" href="../../../res/layui/css/shark.css" media="all">
</head>
<body>

  <div class="layui-fluid" style="padding: 10px;">
    <div class="layui-card panel-card">
      <div class="layui-card-body">
        <table id="LAY-user-sub-manage" lay-filter="LAY-user-sub-manage"></table>
        
        <script type="text/html" id="table-useradmin-subuser">
          <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="reset_pwd"><i class="layui-icon layui-icon-password"></i>重置</a>
        </script>
      </div>
    </div>
  </div>

  <script src="../../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../../res/' // 静态资源所在路径
  }).use(['index', 'table', 'form', 'admin'], function(){
    var $ = layui.$
    ,table = layui.table
    ,form = layui.form
    ,admin = layui.admin;
    
    // 简单的获取参数方式
    function getQueryString(name) {
      var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i");
      var r = window.location.search.substr(1).match(reg);
      if (r != null) return decodeURIComponent(r[2]); return null;
    }
    
    var parentId = window.PARENT_ID || getQueryString('parentId');
    
    // 兼容 layuiAdmin 路由模式
    if(!parentId) {
      var router = layui.router();
      parentId = router.search.parentId;
    }
    
    if (!parentId || parentId === 'null' || parentId === 'undefined') {
      layer.msg('无效的代理商 ID', { icon: 5 });
    }

    // 渲染表格
    table.render({
      elem: '#LAY-user-sub-manage'
      ,url: layui.setter.paths.baseApi + '/api/admin/users/subordinates/' + (parentId || '')
      ,cols: [[
        {field: 'id', title: 'ID', hide: true}
        ,{field: 'username', title: '用户名', minWidth: 100}
        , { field: 'telegram_id', title: 'TelegramID', width: 140, templet: function (d) { return d.telegram_id || '-'; } }
        ,{field: 'points', title: '积分', width: 100, event: 'edit_points', style: 'cursor: pointer;', templet: function(d){ return Math.floor(d.points || 0); }}
        ,{field: 'money', title: '余额', width: 100, event: 'edit_money', style: 'cursor: pointer;', templet: function(d){ return parseFloat(d.money || 0).toFixed(2); }}
        ,{field: 'max_concurrent_tasks', title: '并发数', width: 100, event: 'edit_concurrency', style: 'cursor: pointer;', templet: function(d){ return d.max_concurrent_tasks === -1 ? '无限制' : d.max_concurrent_tasks; }}
        ,{field: 'status', title: '状态', width: 100, templet: function(d){
          var isChecked = d.status === 'normal' ? 'checked' : '';
          return '<input type="checkbox" name="status" value="'+ d.id +'" lay-skin="switch" lay-text="正常|封禁" lay-filter="user-status-switch" '+ isChecked +'>';
        }}
        ,{field: 'created_at', title: '注册时间', width: 170, templet: function(d){
          return layui.util.toDateString(d.created_at, 'yyyy-MM-dd HH:mm:ss');
        }}
        ,{title: '操作', width: 150, align: 'center', fixed: 'right', toolbar: '#table-useradmin-subuser'}
      ]]
      ,page: true
      ,limit: 10
      ,text: '对不起，加载出现异常！'
      ,parseData: function(res){
        return {
          "code": res.code === 200 ? 0 : res.code,
          "msg": res.msg,
          "count": res.data.count,
          "data": res.data.rows
        };
      }
    });

    // 监听工具条
    table.on('tool(LAY-user-sub-manage)', function(obj){
      var data = obj.data;
      if(obj.event === 'del'){
        layer.confirm('确定删除该下级用户吗？', function(index){
          admin.req({
            url: layui.setter.paths.baseApi + '/api/admin/users/delete/' + data.id
            ,method: 'POST'
            ,done: function(res){
              obj.del();
              layer.close(index);
              layer.msg('已删除');
            }
          });
        });
      } else if(obj.event === 'reset_pwd'){
        layer.confirm('确定将该用户的密码重置为 123456 吗？', function(index){
          admin.req({
            url: layui.setter.paths.baseApi + '/api/admin/users/' + data.id + '/reset-password'
            ,method: 'POST'
            ,done: function(res){
              layer.close(index);
              layer.msg('密码已重置为 123456', {icon: 1});
            }
          });
        });
      } else if(obj.event === 'edit_points'){
        layer.prompt({
          formType: 0,
          value: data.points,
          title: '修改下级用户 ['+ data.username +'] 的积分'
        }, function(value, index){
          admin.req({
            url: layui.setter.paths.baseApi + '/api/admin/users/' + data.id + '/points'
            ,method: 'POST'
            ,data: { points: value }
            ,done: function(res){
              layer.close(index);
              obj.update({ points: value });
              layer.msg('积分修改成功', {icon: 1});
            }
          });
        });
      } else if(obj.event === 'edit_money'){
        layer.prompt({
          formType: 0,
          value: data.money,
          title: '修改下级用户 ['+ data.username +'] 的余额'
        }, function(value, index){
          admin.req({
            url: layui.setter.paths.baseApi + '/api/admin/users/' + data.id + '/money'
            ,method: 'POST'
            ,data: { money: value }
            ,done: function(res){
              layer.close(index);
              obj.update({ money: value });
              layer.msg('余额修改成功', {icon: 1});
            }
          });
        });
      } else if(obj.event === 'edit_concurrency'){
        layer.prompt({
          formType: 0,
          value: data.max_concurrent_tasks,
          title: '修改下级用户 ['+ data.username +'] 的并发数'
        }, function(value, index){
          admin.req({
            url: layui.setter.paths.baseApi + '/api/admin/users/' + data.id + '/concurrency'
            ,method: 'POST'
            ,data: { max_concurrent_tasks: value }
            ,done: function(res){
              layer.close(index);
              obj.update({ max_concurrent_tasks: value });
              layer.msg('并发数修改成功', {icon: 1});
            }
          });
        });
      }
    });

    // 监听状态开关
    form.on('switch(user-status-switch)', function(obj){
      var id = this.value;
      var status = obj.elem.checked ? 'normal' : 'banned';
      admin.req({
        url: layui.setter.paths.baseApi + '/api/users/status'
        ,method: 'POST'
        ,data: { id: id, status: status }
        ,done: function(res){
          layer.msg('状态更新成功', {icon: 1});
        }
        ,fail: function(){
          $(obj.elem).prop('checked', !obj.elem.checked);
          form.render('checkbox');
        }
      });
    });
  });
  </script>
</body>
</html>
