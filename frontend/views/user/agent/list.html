<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>下级用户管理</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../../res/adminui/dist/css/admin.css" media="all">
  <link rel="stylesheet" href="../../../res/layui/css/shark.css" media="all">
</head>
<body>

  <div class="layui-fluid" style="padding: 20px;">
    <div class="layui-card panel-card">
      <div class="layui-form layui-card-header layuiadmin-card-header-auto">
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
              <input type="text" name="username" placeholder="请输入用户名" autocomplete="off" class="layui-input">
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
              <select name="status">
                <option value="">不限</option>
                <option value="normal">正常</option>
                <option value="banned">封禁</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <button class="layui-btn layuiadmin-btn-agentsub" lay-submit lay-filter="LAY-user-agentsub-search">
              <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i> 搜索
            </button>
          </div>
        </div>
      </div>
      
      <div class="layui-card-body">
        <table id="LAY-user-agent-subordinate" lay-filter="LAY-user-agent-subordinate"></table>
        
        <script type="text/html" id="table-user-agentsub-tool">
          <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="reset_pwd"><i class="layui-icon layui-icon-password"></i>重置</a>
          <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
        </script>
      </div>
    </div>
  </div>

  <script src="../../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../../res/' // 静态资源所在路径
  }).use(['index', 'agentsub', 'table'], function(){
    var $ = layui.$
    ,form = layui.form
    ,table = layui.table;
    
    // 事件-搜索
    form.on('submit(LAY-user-agentsub-search)', function(data){
      var field = data.field;
      
      // 执行重载
      table.reload('LAY-user-agent-subordinate', {
        where: field
      });
    });
  });
  </script>
</body>
</html>
