<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>套餐表单</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../../res/layui/css/shark.css" media="all">
  <style>
    .layui-form-label {
      font-size: 13px;
    }
    .layui-input, .layui-select, .layui-textarea {
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="layui-form layui-anim layui-anim-upbit" lay-filter="layuiadmin-form-packageadmin" id="layuiadmin-form-packageadmin" style="padding: 20px 0 0 0;">
    <div class="layui-form-item">
      <label class="layui-form-label">套餐名称</label>
      <div class="layui-input-inline">
        <input type="text" name="name" lay-verify="required" placeholder="请输入套餐名称" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">套餐分类</label>
      <div class="layui-input-inline">
        <select name="category" lay-verify="required" lay-filter="categorySelect">
          <option value="points" selected>积分卡</option>
          <option value="thread">线程卡</option>
          <option value="upgrade">升级卡</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">并发数</label>
      <div class="layui-input-inline">
        <input type="number" name="concurrent_tasks" lay-verify="required" placeholder="请输入并发任务数" autocomplete="off" class="layui-input" value="1">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">包含积分</label>
      <div class="layui-input-inline">
        <input type="number" name="points" lay-verify="required" placeholder="请输入积分数量" autocomplete="off" class="layui-input" value="0">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">包含余额</label>
      <div class="layui-input-inline">
        <input type="number" name="balance" lay-verify="required" placeholder="请输入包含余额" autocomplete="off" class="layui-input" value="0">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">执行上限(分)</label>
      <div class="layui-input-inline">
        <input type="number" name="display_duration" lay-verify="required" placeholder="请输入分钟数" autocomplete="off" class="layui-input" value="0">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">日提单数</label>
      <div class="layui-input-inline">
        <input type="number" name="daily_order_limit" lay-verify="required" placeholder="请输入每日提单限制" autocomplete="off" class="layui-input" value="0">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">用户等级</label>
      <div class="layui-input-inline">
        <select name="target_role">
          <option value="">保持原样</option>
          <option value="Agent">升级为代理商</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">代理价格</label>
      <div class="layui-input-inline">
        <input type="number" name="agent_price" lay-verify="required" placeholder="请输入代理价格" autocomplete="off" class="layui-input" value="0">
      </div>
    </div>
    <div class="layui-form-item layui-hide">
      <input type="button" lay-submit lay-filter="LAY-package-front-submit" id="LAY-package-front-submit" value="确认">
    </div>
  </div>

  <script src="../../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../../res/' // 静态资源所在路径
  }).use(['index', 'form'], function(){
    var $ = layui.$
    ,form = layui.form;

    // 根据套餐分类调整字段状态
    function checkCategory(category) {
      var $role = $('select[name="target_role"]');
      var $concurrent = $('input[name="concurrent_tasks"]');
      var $points = $('input[name="points"]');
      var $duration = $('input[name="display_duration"]');
      var $dailyLimit = $('input[name="daily_order_limit"]');
      var $balance = $('input[name="balance"]');

      // 重置所有禁用状态
      $role.prop('disabled', false);
      $concurrent.prop('disabled', false);
      $points.prop('disabled', false);
      $duration.prop('disabled', false);
      $dailyLimit.prop('disabled', false);
      $balance.prop('disabled', false);

      if (category === 'points') {
        // 积分卡：强制线程数、日提单数和执行分钟数为 -1
        $concurrent.val(-1).prop('disabled', true);
        $dailyLimit.val(-1).prop('disabled', true);
        $duration.val(-1).prop('disabled', true);
        $role.val('').prop('disabled', true);
        $balance.val(0).prop('disabled', true);
      } else if (category === 'thread') {
        // 线程卡：强制积分数为 0
        $points.val(0).prop('disabled', true);
        $role.val('').prop('disabled', true);
        $balance.val(0).prop('disabled', true);
      } else if (category === 'upgrade') {
        // 升级卡：允许包含所有属性
      }

      form.render();
    }

    // 初始化检查
    checkCategory($('select[name="category"]').val());

    form.on('select(categorySelect)', function(data){
      checkCategory(data.value);
    });
  });
  </script>
</body>
</html>
