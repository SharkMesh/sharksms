<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>短信接口表单</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../res/layui/css/shark.css" media="all">
  <style>
    .layui-form-label { width: 100px; }
    .layui-input-block { margin-left: 130px; }
  </style>
</head>
<body>

  <div class="layui-form" lay-filter="LAY-interface-form" id="LAY-interface-form" style="padding: 20px 30px 0 0;">
    <div class="layui-form-item">
      <label class="layui-form-label">接口名称</label>
      <div class="layui-input-block">
        <input type="text" name="name" placeholder="如：阿里云短信 (可选)" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">请求URL</label>
      <div class="layui-input-block">
        <input type="text" name="url" lay-verify="required|url" placeholder="https://api.example.com/send" autocomplete="off" class="layui-input">
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">请求方式</label>
      <div class="layui-input-block">
        <select name="method" lay-verify="required">
          <option value="POST">POST</option>
          <option value="GET">GET</option>
          <option value="PUT">PUT</option>
        </select>
      </div>
    </div>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">Cookie</label>
      <div class="layui-input-block">
        <textarea name="cookie" placeholder="请输入 Cookie (可选)" class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">Header (JSON)</label>
      <div class="layui-input-block">
        <textarea name="header" placeholder='{"Content-Type": "application/json"}' class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label">Post Data</label>
      <div class="layui-input-block">
        <textarea name="post_data" placeholder='请输入 POST 数据 (JSON 或 Query String)' class="layui-textarea"></textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">状态</label>
      <div class="layui-input-block">
        <input type="checkbox" name="status" lay-skin="switch" lay-text="启用|禁用" value="1" checked>
      </div>
    </div>
    <div class="layui-form-item layui-hide">
      <input type="button" lay-submit lay-filter="LAY-interface-submit" id="LAY-interface-submit" value="确认">
    </div>
  </div>

  <script src="../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../res/' 
  }).use(['index', 'form'], function(){
    var $ = layui.$
    ,form = layui.form;
  })
  </script>
</body>
</html>
