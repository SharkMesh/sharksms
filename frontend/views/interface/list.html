<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>短信接口管理</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../res/layui/css/layui.css" media="all">
  <link rel="stylesheet" href="../../res/adminui/dist/css/admin.css" media="all">
  <link rel="stylesheet" href="../../res/layui/css/shark.css" media="all">
</head>
<body>

  <div class="layui-fluid" style="padding: 20px;">
    <div class="layui-card panel-card">
      <div class="layui-form layui-card-header layuiadmin-card-header-auto">
        <div class="layui-form-item">
          <div class="layui-inline">
            <label class="layui-form-label">接口名称</label>
            <div class="layui-input-block">
              <input type="text" name="name" placeholder="请输入" autocomplete="off" class="layui-input">
            </div>
          </div>
          <div class="layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
              <select name="status">
                <option value="">全部</option>
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>
          </div>
          <div class="layui-inline">
            <button class="layui-btn layuiadmin-btn-interface" lay-submit lay-filter="LAY-interface-search">
              <i class="layui-icon layui-icon-search layuiadmin-button-btn"></i> 搜索
            </button>
          </div>
        </div>
      </div>
      
      <div class="layui-card-body">
        <div style="padding-bottom: 10px;">
          <button class="layui-btn layui-btn-normal layuiadmin-btn-interface" data-type="add">添加接口</button>
          <button class="layui-btn layui-btn-warm layuiadmin-btn-interface" data-type="testAll">一键测试</button>
        </div>
        
        <table id="LAY-interface-manage" lay-filter="LAY-interface-manage"></table>
        
        <script type="text/html" id="statusTpl">
          <input type="checkbox" name="status" lay-skin="switch" lay-text="启用|禁用" lay-filter="LAY-interface-status" 
            value="{{ d.id }}" {{ d.status == 1 ? 'checked' : '' }}>
        </script>

        <script type="text/html" id="table-interface-admin">
          <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="test"><i class="layui-icon layui-icon-release"></i>测试</a>
          <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a>
          <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
        </script>
      </div>
    </div>
  </div>

  <script src="../../res/layui/layui.js"></script>  
  <script>
  layui.config({
    base: '../../res/' // 静态资源所在路径
  }).use(['index', 'interfaceadmin', 'table'], function(){
    var $ = layui.$
    ,form = layui.form
    ,table = layui.table;
    
    // 搜索
    form.on('submit(LAY-interface-search)', function(data){
      var field = data.field;
      table.reload('LAY-interface-manage', {
        where: field
      });
    });
  
    // 事件
    var active = {
      add: function(){
        layer.open({
          type: 2
          ,title: '添加接口'
          ,content: 'interfaceform.html'
          ,maxmin: true
          ,area: ['600px', '600px']
          ,btn: ['确定', '取消']
          ,yes: function(index, layero){
            var iframeWindow = window['layui-layer-iframe'+ index]
            ,submitID = 'LAY-interface-submit'
            ,submit = layero.find('iframe').contents().find('#'+ submitID);

            iframeWindow.layui.form.on('submit('+ submitID +')', function(data){
              var field = data.field;
              
              // 如果名称为空，则生成时间戳
              if(!field.name || field.name.trim() === ''){
                field.name = 'Interface_' + new Date().getTime();
              }
              
              layui.admin.req({
                url: layui.setter.paths.baseApi + '/api/sms-interfaces'
                ,method: 'POST'
                ,data: field
                ,done: function(res){
                  table.reload('LAY-interface-manage');
                  layer.close(index);
                  layer.msg('添加成功');
                }
              });
            });  
            
            submit.trigger('click');
          }
        }); 
      },
      testAll: function(){
        layer.confirm('确定要一键测试所有接口吗？', function(index){
          layui.admin.req({
            url: layui.setter.paths.baseApi + '/api/sms-interfaces/test-all'
            ,method: 'POST'
            ,done: function(res){
              layer.close(index);
              layer.msg('测试任务已启动，请稍后查看结果', {icon: 1});
            }
          });
        });
      }
    };
    
    $('.layui-btn.layuiadmin-btn-interface').on('click', function(){
      var type = $(this).data('type');
      active[type] ? active[type].call(this) : '';
    });
  });
  </script>
</body>
</html>
